
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Django Email Sender</title>
</head>
<body>
    <h1>Django Email Sender</h1>

    {% if sent %}
        <p>Email prepared successfully! Check your terminal output.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Prepare Email</button>
    </form>
</body>
</html>
